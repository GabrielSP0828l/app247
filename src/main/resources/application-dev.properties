# Desenvolvimento local: MySQL e Redis publicados em 127.0.0.1 pelo docker-compose.test.yml.
# Credenciais vêm do ambiente (mesmos nomes do .env); nenhum valor sensível tem default.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:app247}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${MYSQL_USER}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD}}
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
